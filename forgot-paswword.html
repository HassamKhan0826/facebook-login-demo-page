<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Find Your Account</title>
    <link rel="stylesheet" href="css/forgot.css">
</head>
<body>
<!-- ===================== Header Section ===================== -->
<header class="site-header">
    <div class="header-container">
        <img src="images/facebook-logo.png" alt="Facebook Logo" class="header-logo">
    </div>
</header>

<!-- ===================== Main Section ===================== -->
<main class="main-container">

    <!-- ============ Forgot Password Card ============ -->
    <section class="forgot-card">

        <!-- ============ Card Heading ============ -->
        <div class="card-header">
            <h1 class="card-heading">Find Your Account</h1>
        </div>

        <!-- ============ Card Body ============ -->
        <div class="card-body">

            <!-- Description Text -->
            <p class="card-description">
                Please enter your email address or mobile number to search for your account.
            </p>

            <!-- Search Form -->
            <form class="search-form" action="#" method="post">

                <!-- Email or Phone Input -->
                <label for="identifier" class="visually-hidden">Email or mobile number</label>
                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    class="identifier-input"
                    placeholder="Email or mobile number"
                    required
                >

            </form>

        </div>

        <!-- ============ Card Footer: Action Buttons ============ -->
        <div class="card-footer">
            <a href="index.html" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-search">Search</button>
        </div>

    </section>

</main>
</body>
</html>
